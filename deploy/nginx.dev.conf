log_format json_tts_server escape=json '{'
    '"time":"$time_iso8601",'         
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'      
    '"uri":"$request_uri",'            
    '"status":$status,'
    '"request_time":$request_time,'   
    '"upstream_rt":"$upstream_response_time",' 
    '"upstream_addr":"$upstream_addr",'  
    '"upstream_status":"$upstream_status",'
    '"body_bytes":$body_bytes_sent,'
    '"host":"$host",'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent"'
'}';


# 2. HTTPS 代理配置
server {
  listen 3342;

  access_log syslog:server=127.0.0.1:11514,tag=site_tts_server,severity=info json_tts_server;
  error_log syslog:server=127.0.0.1:11514,tag=site_tts_server_err,severity=error;

  # --- 优化配置 ---
  client_max_body_size 20m;         # 允许上传最大 20MB 的音频文件
  large_client_header_buffers 4 32k;

  # 代理缓冲区设置 (解决 upstream header 过大报错)
  proxy_buffer_size          128k;
  proxy_buffers              4 256k;
  proxy_busy_buffers_size    256k;

  # 反向代理核心配置
  location / {
    proxy_pass http://127.0.0.1:6001;
    
    # 传递客户端真实 IP 给后端
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 支持 (如果你的 TTS 服务后续涉及到长连接)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 超时设置
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }
}